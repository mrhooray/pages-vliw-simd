  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;mcts-run-006&quot;);
    const svg = root.querySelector(&quot;#mcts-run-006-svg&quot;);
    const tooltip = root.querySelector(&quot;#mcts-run-006-tooltip&quot;);
    const nodes = JSON.parse(root.querySelector(&quot;#mcts-run-006-data&quot;).textContent);
    const byId = new Map(nodes.map((node) =&gt; [node.id, node]));
    const children = new Map(nodes.map((node) =&gt; [node.id, []]));
    nodes.forEach((node) =&gt; {
      if (node.parent_id &amp;&amp; children.has(node.parent_id)) children.get(node.parent_id).push(node);
    });
    children.forEach((items) =&gt; items.sort((a, b) =&gt; a.candidate_index - b.candidate_index));

    const treeRoot = nodes.find((node) =&gt; !node.parent_id);
    let leafIndex = 0;
    let maxDepth = 0;
    function assignTreePosition(node, depth) {
      node.depth = depth;
      maxDepth = Math.max(maxDepth, depth);
      const descendants = children.get(node.id);
      if (!descendants.length) {
        node.leaf = leafIndex++;
        return node.leaf;
      }
      const positions = descendants.map((child) =&gt; assignTreePosition(child, depth + 1));
      node.leaf = positions.reduce((sum, value) =&gt; sum + value, 0) / positions.length;
      return node.leaf;
    }
    assignTreePosition(treeRoot, 0);

    const width = 720;
    const height = Math.max(540, leafIndex * 21 + 64);
    const left = 34;
    const right = 24;
    const top = 42;
    const bottom = 24;
    const plotWidth = width - left - right;
    const plotHeight = height - top - bottom;
    nodes.forEach((node) =&gt; {
      node.x = left + (node.depth / Math.max(1, maxDepth)) * plotWidth;
      node.y = top + (node.leaf / Math.max(1, leafIndex - 1)) * plotHeight;
    });
    svg.setAttribute(&quot;viewBox&quot;, `0 0 ${width} ${height}`);

    const ns = &quot;http://www.w3.org/2000/svg&quot;;
    const make = (name, attributes = {}) =&gt; {
      const element = document.createElementNS(ns, name);
      Object.entries(attributes).forEach(([key, value]) =&gt; element.setAttribute(key, value));
      return element;
    };
    const title = make(&quot;title&quot;, { id: &quot;mcts-run-006-title&quot; });
    title.textContent = &quot;SPAR P=1 run-006 candidate tree&quot;;
    const desc = make(&quot;desc&quot;, { id: &quot;mcts-run-006-desc&quot; });
    desc.textContent = &quot;A 128-candidate SPAR P=1 tree for run-006, from the 147,734-cycle baseline to 1,374 cycles. Select a node for its hypothesis, outcome, lineage, visits, and elapsed time.&quot;;
    svg.append(title, desc);

    const depthStep = maxDepth &gt; 60 ? 10 : 5;
    for (let depth = 0; depth &lt;= maxDepth; depth += depthStep) {
      const x = left + (depth / Math.max(1, maxDepth)) * plotWidth;
      svg.appendChild(make(&quot;line&quot;, { x1: x, x2: x, y1: top - 10, y2: height - bottom, class: &quot;mcts-grid&quot; }));
      const label = make(&quot;text&quot;, { x, y: 30, &quot;text-anchor&quot;: &quot;middle&quot;, class: &quot;mcts-axis-label text-small&quot; });
      label.textContent = depth;
      svg.appendChild(label);
    }
    const depthLabel = make(&quot;text&quot;, { x: left, y: 14, class: &quot;mcts-axis-label text-small&quot; });
    depthLabel.textContent = &quot;MCTS depth&quot;;
    svg.appendChild(depthLabel);

    const edgeLayer = make(&quot;g&quot;, { &quot;aria-hidden&quot;: &quot;true&quot; });
    const nodeLayer = make(&quot;g&quot;);
    svg.append(edgeLayer, nodeLayer);
    const edgeByChild = new Map();
    nodes.forEach((node) =&gt; {
      if (!node.parent_id) return;
      const parent = byId.get(node.parent_id);
      const middle = (parent.x + node.x) / 2;
      const path = make(&quot;path&quot;, {
        d: `M ${parent.x} ${parent.y} C ${middle} ${parent.y}, ${middle} ${node.y}, ${node.x} ${node.y}`,
        class: &quot;mcts-edge&quot;,
      });
      edgeLayer.appendChild(path);
      edgeByChild.set(node.id, path);
    });

    const winner = nodes.reduce((best, node) =&gt; {
      if (node.cycles == null) return best;
      return !best || node.cycles &lt; best.cycles ? node : best;
    }, null);
    const linkById = new Map();
    const radius = (node) =&gt; 3 + Math.min(3, Math.sqrt(Math.max(1, node.mcts_visits)) / 3);
    nodes.forEach((node) =&gt; {
      const link = make(&quot;a&quot;, {
        href: &quot;#mcts-run-006-detail&quot;,
        class: `mcts-node ${node.decision === &quot;keep&quot; ? &quot;is-keep&quot; : &quot;&quot;} ${node.cycles == null ? &quot;is-failed&quot; : &quot;&quot;} ${node.id === winner.id ? &quot;is-winner&quot; : &quot;&quot;}`,
        &quot;data-id&quot;: node.id,
        &quot;aria-label&quot;: `Candidate ${node.candidate_index}, ${node.cycles == null ? &quot;failed&quot; : `${node.cycles.toLocaleString()} cycles`}, ${node.decision || node.status}`,
      });
      const nodeRadius = radius(node);
      link.appendChild(make(&quot;circle&quot;, { cx: node.x, cy: node.y, r: nodeRadius }));
      if (node.cycles == null) {
        const markRadius = nodeRadius * 0.55;
        link.appendChild(make(&quot;line&quot;, {
          x1: node.x - markRadius,
          y1: node.y - markRadius,
          x2: node.x + markRadius,
          y2: node.y + markRadius,
          class: &quot;mcts-failure-mark&quot;,
        }));
        link.appendChild(make(&quot;line&quot;, {
          x1: node.x + markRadius,
          y1: node.y - markRadius,
          x2: node.x - markRadius,
          y2: node.y + markRadius,
          class: &quot;mcts-failure-mark&quot;,
        }));
      }
      nodeLayer.appendChild(link);
      linkById.set(node.id, link);

      link.addEventListener(&quot;click&quot;, (event) =&gt; {
        event.preventDefault();
        selectNode(node);
      });
      link.addEventListener(&quot;mouseenter&quot;, () =&gt; showTooltip(node, link));
      link.addEventListener(&quot;mouseleave&quot;, hideTooltip);
      link.addEventListener(&quot;focus&quot;, () =&gt; showTooltip(node, link));
      link.addEventListener(&quot;blur&quot;, hideTooltip);
    });

    const firstAtOrBelow = (threshold) =&gt;
      nodes.find((node) =&gt; node.cycles != null &amp;&amp; node.cycles &lt;= threshold);
    const annotationNodes = [
      treeRoot,
      firstAtOrBelow(10000),
      firstAtOrBelow(2000),
      firstAtOrBelow(1500),
      winner,
    ].filter((node, index, items) =&gt; node &amp;&amp; items.findIndex((item) =&gt; item.id === node.id) === index);
    const annotationIds = new Map(annotationNodes.map((node, index) =&gt; [
      node.id,
      {
        text: `C${node.candidate_index} · ${node.cycles.toLocaleString()}`,
        dx: 7,
        dy: index % 2 === 0 ? -10 : 16,
      },
    ]));
    annotationIds.forEach((annotation, id) =&gt; {
      const node = byId.get(id);
      if (!node) return;
      const nearRightEdge = node.x &gt; width - 100;
      const label = make(&quot;text&quot;, {
        x: node.x + (nearRightEdge ? -7 : annotation.dx),
        y: node.y + annotation.dy,
        &quot;text-anchor&quot;: nearRightEdge ? &quot;end&quot; : &quot;start&quot;,
        class: `mcts-annotation text-small ${id === winner.id ? &quot;is-winner&quot; : &quot;&quot;}`,
      });
      label.textContent = annotation.text;
      svg.appendChild(label);
    });

    function formatElapsed(totalSeconds) {
      if (totalSeconds == null) return &quot;time unavailable&quot;;
      const seconds = Math.round(totalSeconds);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const remainder = seconds % 60;
      return `${hours}h ${String(minutes).padStart(2, &quot;0&quot;)}m ${String(remainder).padStart(2, &quot;0&quot;)}s`;
    }

    function selectedLineage(node) {
      const ids = new Set();
      let current = node;
      while (current) {
        ids.add(current.id);
        current = current.parent_id ? byId.get(current.parent_id) : null;
      }
      return ids;
    }

    function selectNode(node) {
      const lineage = selectedLineage(node);
      linkById.forEach((link, id) =&gt; {
        link.classList.toggle(&quot;is-path&quot;, lineage.has(id));
        link.classList.toggle(&quot;is-selected&quot;, id === node.id);
      });
      edgeByChild.forEach((edge, id) =&gt; edge.classList.toggle(&quot;is-path&quot;, lineage.has(id)));

      const parent = node.parent_id ? byId.get(node.parent_id) : null;
      const delta = parent &amp;&amp; node.cycles != null &amp;&amp; parent.cycles != null ? node.cycles - parent.cycles : null;
      root.querySelector(&quot;#mcts-run-006-candidate-index&quot;).textContent = `C${node.candidate_index}`;
      root.querySelector(&quot;#mcts-run-006-candidate-id&quot;).textContent = node.id;
      root.querySelector(&quot;#mcts-run-006-cycles&quot;).textContent = node.cycles == null ? &quot;No valid cycle result&quot; : `${node.cycles.toLocaleString()} cycles`;
      root.querySelector(&quot;#mcts-run-006-parent-delta&quot;).textContent = delta == null ? &quot;root&quot; : delta &lt; 0 ? `${Math.abs(delta).toLocaleString()} fewer than parent` : delta &gt; 0 ? `${delta.toLocaleString()} more than parent` : &quot;tied parent&quot;;
      root.querySelector(&quot;#mcts-run-006-decision&quot;).textContent = node.decision || node.status;
      root.querySelector(&quot;#mcts-run-006-visits&quot;).textContent = `${node.mcts_visits.toLocaleString()} MCTS visit${node.mcts_visits === 1 ? &quot;&quot; : &quot;s&quot;}`;
      root.querySelector(&quot;#mcts-run-006-elapsed&quot;).textContent = formatElapsed(node.elapsed_seconds);
      root.querySelector(&quot;#mcts-run-006-hypothesis&quot;).textContent = node.hypothesis;
      root.querySelector(&quot;#mcts-run-006-evaluation&quot;).textContent = node.error || node.eval_summary || &quot;No evaluation summary recorded.&quot;;
      root.querySelector(&quot;#mcts-run-006-decision-reason&quot;).textContent = node.decision_reason || &quot;No decision rationale recorded.&quot;;
    }

    function showTooltip(node, link) {
      tooltip.textContent = `C${node.candidate_index} · ${node.cycles == null ? &quot;failed&quot; : `${node.cycles.toLocaleString()} cycles`} · ${formatElapsed(node.elapsed_seconds)} · Hypothesis: ${node.hypothesis}`;
      tooltip.classList.add(&quot;is-visible&quot;);
      const stageRect = root.querySelector(&quot;.mcts-stage&quot;).getBoundingClientRect();
      const nodeRect = link.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      const centered = nodeRect.left - stageRect.left + nodeRect.width / 2 - tooltipRect.width / 2;
      const leftPosition = Math.max(4, Math.min(centered, stageRect.width - tooltipRect.width - 4));
      const above = nodeRect.top - stageRect.top - tooltipRect.height - 8;
      const topPosition = above &gt;= 0 ? above : nodeRect.bottom - stageRect.top + 8;
      tooltip.style.left = `${leftPosition}px`;
      tooltip.style.top = `${topPosition}px`;
    }

    function hideTooltip() {
      tooltip.classList.remove(&quot;is-visible&quot;);
    }

    selectNode(winner);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
